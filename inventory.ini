[dcs_nodes]
dcs1 ansible_host=192.168.1.11
dcs2 ansible_host=192.168.1.12
dcs3 ansible_host=192.168.1.13

[postgresql_nodes]
pg1 ansible_host=192.168.1.21 pg_replication_ip=10.0.0.21
pg2 ansible_host=192.168.1.22 pg_replication_ip=10.0.0.22
pg3 ansible_host=192.168.1.23 pg_replication_ip=10.0.0.23

[all:vars]
ansible_user=your_ssh_user
# Ensure you have passwordless sudo configured for this user or set ansible_become_pass
# ansible_become_pass=your_sudo_password

# DCS settings (etcd example)
dcs_type=etcd
etcd_initial_cluster_token=patroni-cluster-token
etcd_initial_advertise_peer_urls_scheme=http
etcd_listen_peer_urls_scheme=http
etcd_listen_client_urls_scheme=http
etcd_advertise_client_urls_scheme=http

# Patroni settings
patroni_scope=patroni_cluster
patroni_namespace=/service/
patroni_admin_user=admin
patroni_admin_password=admin_password
patroni_replication_user=replicator
patroni_replication_password=replicator_password
patroni_superuser_user=postgres
patroni_superuser_password=postgres_password
patroni_rewind_user=rewind
patroni_rewind_password=rewind_password

# PostgreSQL settings
pg_version=17
pg_data_dir=/var/lib/postgresql/{{ pg_version }}/main

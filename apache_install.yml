---
- hosts: all
  become: yes
  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install apache2 package
      apt:
        name: apache2
        state: present

    - name: Ensure apache2 service is started and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Check Apache status
      uri:
        url: http://localhost
        return_content: yes
      register: apache_status
      failed_when: "'It works!' not in apache_status.content"
